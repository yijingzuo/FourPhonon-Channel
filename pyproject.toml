[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fourphonon-channel"
version = "0.1.0"
description = "Validate, summarize, compare, and plot A/O-resolved FourPhonon scattering channels"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-only"}
authors = [{name = "Yijing Zuo", email = "yijingzuo@whu.edu.cn"}]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.scripts]
fourphonon-channel = "fourphonon_channel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
